# Captain Remote HTTPS ingress example.
# Replace the example hostname and certificate paths before you deploy.

limit_req_zone $binary_remote_addr zone=captain_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_conn_zone $server_name zone=per_server:10m;

# Log the path but not query strings or the Authorization header.
log_format captain_remote
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent request_time=$request_time';

server {
    listen 443 ssl;
    server_name captain.example.com;

    ssl_certificate /etc/nginx/captain-remote.crt;
    ssl_certificate_key /etc/nginx/captain-remote.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/captain-remote-access.log captain_remote;

    limit_req zone=captain_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn per_ip 20;
    limit_conn per_server 100;
    limit_conn_status 429;

    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 2 8k;

    location ^~ /captain/v1/ {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Captain-Client-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    location / { return 404; }
}
